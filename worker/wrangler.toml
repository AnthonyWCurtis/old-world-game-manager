name = "old-world-unmatched-reports"
main = "unmatched-report-worker.mjs"
compatibility_date = "2026-07-01"

[vars]
ALLOWED_ORIGIN = "https://anthonywcurtis.github.io"

# Add these SECRETS in Cloudflare Workers. Do not commit secret values.
# GITHUB_TOKEN = fine-grained GitHub token for this repository (Contents: Read and write)
# TURNSTILE_SECRET = Turnstile secret key
#
# Limits reports per client address to reduce spam in the public repository.
[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 5
period = 60
