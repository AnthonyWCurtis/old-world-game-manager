name: Check TOW source access
on:
  push:
    paths:
      - '.github/workflows/check-tow-access.yml'
permissions:
  contents: read
jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check robots and browser access headers (no scraping)
        shell: bash
        run: |
          set -u
          echo "=== ROBOTS (HTTP code and robots text only) ==="
          curl -L --max-time 12 -sS -w '\nHTTP: %{http_code}\n' https://tow.whfb.app/robots.txt | head -c 3500 || true
          echo
          echo "=== HTML page HEAD with our Pages origin ==="
          curl -sSI --max-time 12 -H 'Origin: https://anthonywcurtis.github.io' https://tow.whfb.app/unit/night-goblin-oddnob | grep -iE '^(HTTP/|access-control-|content-type:|etag:|last-modified:|location:|cache-control:)' || true
          echo "=== Public API probe HEAD ==="
          curl -sSI --max-time 12 -H 'Origin: https://anthonywcurtis.github.io' https://tow.whfb.app/api/ | grep -iE '^(HTTP/|access-control-|content-type:|location:)' || true

      - name: Confirm permitted sitemap structure (index pages only)
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          import re
          base='https://tow.whfb.app'
          for p in ('/sitemap/armies','/sitemap/rules','/sitemap/magic-items'):
              req=Request(base+p, headers={'User-Agent':'OldWorldGameManager/0.1 (source index metadata check)','Origin':'https://anthonywcurtis.github.io'})
              with urlopen(req, timeout=15) as r:
                  html=r.read().decode('utf-8','replace')
                  print(p, 'STATUS',r.status,'CORS',r.headers.get('access-control-allow-origin'),'BYTES',len(html))
              for probe in ('night-goblin-oddnob','goblin-bolt-throwa','talisman-of-protection','ambushers'):
                  m=re.search(r'<a[^>]*href="[^"]*'+re.escape(probe)+r'[^"]*"[^>]*>.*?</a>',html,re.I|re.S)
                  if m:
                      print('  ', probe, re.sub(r'\s+',' ',m.group(0)[:450]))
          PY

      - name: Inspect HTML structure of one permitted unit page
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from urllib.request import urlopen, Request
          req=Request('https://tow.whfb.app/unit/night-goblin-oddnob',headers={'Origin':'https://anthonywcurtis.github.io','User-Agent':'Mozilla/5.0 (Macintosh; Intel Mac OS X) AppleWebKit/605.1.15 Version/18.6 Safari/605.1.15'})
          with urlopen(req,timeout=15) as r:
            html=r.read().decode('utf-8','replace')
            print('Status',r.status,'bytes',len(html),'CORS',r.headers.get('access-control-allow-origin'))
          for pattern in ('<main','<table','Cost:','Night Goblin Oddnob'):
            m=re.search(re.escape(pattern),html,re.I)
            print(pattern, repr(html[max(0,m.start()-120):m.start()+850] if m else 'NOT FOUND'))
          PY
