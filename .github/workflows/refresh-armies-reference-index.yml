name: Refresh TOW armies reference index
on:
  push:
    branches:
      - main
      - feat/armies-sitemap-index-20261109
    paths:
      - 'scripts/build-armies-reference-index.mjs'
      - '.github/workflows/refresh-armies-reference-index.yml'
  schedule:
    - cron: '49 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: armies-reference-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Index global army and unit pages from the public sitemap
        run: node --check scripts/build-armies-reference-index.mjs && node scripts/build-armies-reference-index.mjs
      - name: Commit source-indexed army references
        run: |
          git config user.name "old-world-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/reference-records/armies-index.json docs/reference-records/armies-summary.json
          if git diff --cached --quiet; then
            echo "No armies index changes."
          else
            git commit -m "Refresh TOW army and unit sitemap reference index"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
