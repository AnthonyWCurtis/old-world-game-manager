name: Sitemap coverage audit
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'
  push:
    paths:
      - 'scripts/audit-sitemap-coverage.mjs'
      - 'scripts/audit-reference-collections.mjs'
      - 'scripts/render-sitemap-audit.mjs'
      - 'docs/reference-records/**'
      - 'docs/unit-data/**'
      - 'tests/*coverage-audit.test.mjs'
      - 'tests/reference-collections-audit.test.mjs'
      - 'tests/sitemap-audit-summary.test.mjs'
      - '.github/workflows/sitemap-coverage-audit.yml'
  pull_request:
    paths:
      - 'scripts/audit-sitemap-coverage.mjs'
      - 'scripts/audit-reference-collections.mjs'
      - 'scripts/render-sitemap-audit.mjs'
      - 'docs/reference-records/**'
      - 'docs/unit-data/**'
      - 'tests/*coverage-audit.test.mjs'
      - 'tests/reference-collections-audit.test.mjs'
      - 'tests/sitemap-audit-summary.test.mjs'
      - '.github/workflows/sitemap-coverage-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit implementation and existing stored data
        run: node --test tests/sitemap-coverage-audit.test.mjs tests/reference-collections-audit.test.mjs tests/sitemap-audit-summary.test.mjs
      - name: Produce machine-readable coverage report
        if: always()
        run: node scripts/audit-sitemap-coverage.mjs artifacts/sitemap-coverage.json
      - name: Generate readable warning summary
        if: always()
        run: node scripts/render-sitemap-audit.mjs artifacts/sitemap-coverage.json artifacts/sitemap-summary.md
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-coverage
          path: |
            artifacts/sitemap-coverage.json
            artifacts/sitemap-summary.md
          if-no-files-found: warn
          retention-days: 30
