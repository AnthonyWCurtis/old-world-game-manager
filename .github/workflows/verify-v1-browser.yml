name: Verify v1 Game Screen in mobile browser
on:
  push:
    branches:
      - feat/v1-game-manager-foundation
    paths:
      - 'docs/**'
      - 'tests/tactical-site-wide-contrast-browser-smoke.mjs'
      - 'tests/tactical-magic-contrast-browser-smoke.mjs'
      - 'tests/tactical-command-browser-smoke.mjs'
      - 'tests/focused-unit-details-browser-smoke.mjs'
      - 'tests/roster-long-press-reorder-browser-smoke.mjs'
      - 'tests/compact-roster-browser-smoke.mjs'
      - 'tests/compact-unit-wound-browser-smoke.mjs'
      - 'tests/v1-browser-smoke.mjs'
      - 'tests/stage3-browser-smoke.mjs'
      - 'tests/stage4-browser-smoke.mjs'
      - 'tests/stage4b-browser-smoke.mjs'
      - 'tests/player-customization-browser-smoke.mjs'
      - 'tests/mobile-responsive-browser-smoke.mjs'
      - 'tests/known-spell-battle-browser-smoke.mjs'
      - 'tests/offline-stale-cache-refresh-browser-smoke.mjs'
      - 'tests/game-screen-return-navigation-browser-smoke.mjs'
      - 'tests/touch-game-layout-browser-smoke.mjs'
      - 'tests/source-special-rule-effects-browser-smoke.mjs'
      - 'tests/source-core-rule-effects-browser-smoke.mjs'
      - 'tests/effects-engine-browser-smoke.mjs'
      - 'tests/reported-wood-elf-browser-smoke.mjs'
      - '.github/workflows/verify-v1-browser.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/focused-unit-details-browser-smoke.mjs'
      - 'tests/compact-roster-browser-smoke.mjs'
      - 'tests/compact-unit-wound-browser-smoke.mjs'
      - 'tests/v1-browser-smoke.mjs'
      - 'tests/stage3-browser-smoke.mjs'
      - 'tests/stage4-browser-smoke.mjs'
      - 'tests/stage4b-browser-smoke.mjs'
      - 'tests/player-customization-browser-smoke.mjs'
      - 'tests/mobile-responsive-browser-smoke.mjs'
      - 'tests/known-spell-battle-browser-smoke.mjs'
      - 'tests/offline-stale-cache-refresh-browser-smoke.mjs'
      - 'tests/game-screen-return-navigation-browser-smoke.mjs'
      - 'tests/touch-game-layout-browser-smoke.mjs'
      - 'tests/source-special-rule-effects-browser-smoke.mjs'
      - 'tests/source-core-rule-effects-browser-smoke.mjs'
      - 'tests/effects-engine-browser-smoke.mjs'
      - 'tests/reported-wood-elf-browser-smoke.mjs'
      - '.github/workflows/verify-v1-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.56.1
          # Ubuntu hosted runners already include Chromium's shared runtime libs.
          # Download only the headless shell; apt font mirrors can be unavailable.
          npx playwright install --only-shell chromium
      - name: Serve static app and test mobile/tablet viewports with offline reload
        run: |
          python3 -m http.server 8787 --directory docs >/tmp/gm-v1-http.log 2>&1 &
          sleep 2
          node tests/tactical-site-wide-contrast-browser-smoke.mjs
          node tests/tactical-magic-contrast-browser-smoke.mjs
          node tests/tactical-command-browser-smoke.mjs
          node tests/focused-unit-details-browser-smoke.mjs
          node tests/roster-long-press-reorder-browser-smoke.mjs
          node tests/compact-roster-browser-smoke.mjs
          node tests/compact-unit-wound-browser-smoke.mjs
          node tests/v1-browser-smoke.mjs
          node tests/stage3-browser-smoke.mjs
          node tests/stage4-browser-smoke.mjs
          node tests/stage4b-browser-smoke.mjs
          node tests/player-customization-browser-smoke.mjs
          node tests/mobile-responsive-browser-smoke.mjs
          node tests/known-spell-battle-browser-smoke.mjs
          node tests/offline-stale-cache-refresh-browser-smoke.mjs
          node tests/game-screen-return-navigation-browser-smoke.mjs
          node tests/touch-game-layout-browser-smoke.mjs
          node tests/source-special-rule-effects-browser-smoke.mjs
          node tests/source-core-rule-effects-browser-smoke.mjs
          node tests/effects-engine-browser-smoke.mjs
          node tests/reported-wood-elf-browser-smoke.mjs
