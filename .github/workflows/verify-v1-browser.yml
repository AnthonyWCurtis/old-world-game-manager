name: Verify v1 Game Screen in mobile browser
on:
  push:
    branches:
      - feat/v1-game-manager-foundation
    paths:
      - 'docs/**'
      - 'tests/v1-browser-smoke.mjs'
      - 'tests/stage3-browser-smoke.mjs'
      - 'tests/stage4-browser-smoke.mjs'
      - 'tests/stage4b-browser-smoke.mjs'
      - 'tests/player-customization-browser-smoke.mjs'
      - 'tests/mobile-responsive-browser-smoke.mjs'
      - 'tests/known-spell-battle-browser-smoke.mjs'
      - 'tests/offline-stale-cache-refresh-browser-smoke.mjs'
      - '.github/workflows/verify-v1-browser.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/v1-browser-smoke.mjs'
      - 'tests/stage3-browser-smoke.mjs'
      - 'tests/stage4-browser-smoke.mjs'
      - 'tests/stage4b-browser-smoke.mjs'
      - 'tests/player-customization-browser-smoke.mjs'
      - 'tests/mobile-responsive-browser-smoke.mjs'
      - 'tests/known-spell-battle-browser-smoke.mjs'
      - 'tests/offline-stale-cache-refresh-browser-smoke.mjs'
      - '.github/workflows/verify-v1-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static app and test mobile/tablet viewports with offline reload
        run: |
          python3 -m http.server 8787 --directory docs >/tmp/gm-v1-http.log 2>&1 &
          sleep 2
          node tests/v1-browser-smoke.mjs
          node tests/stage3-browser-smoke.mjs
          node tests/stage4-browser-smoke.mjs
          node tests/stage4b-browser-smoke.mjs
          node tests/player-customization-browser-smoke.mjs
          node tests/mobile-responsive-browser-smoke.mjs
          node tests/known-spell-battle-browser-smoke.mjs
          node tests/offline-stale-cache-refresh-browser-smoke.mjs
