name: Refresh TOW magic reference index
on:
  push:
    branches:
      - main
      - feat/magic-sitemap-index-20261109
      - feat/v1-source-lore-filtered-spellbooks
    paths:
      - 'scripts/build-magic-reference-index.mjs'
      - '.github/workflows/refresh-magic-reference-index.yml'
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: magic-reference-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Index magic lores and spells from source sitemap
        run: node --check scripts/build-magic-reference-index.mjs && node scripts/build-magic-reference-index.mjs
      - name: Commit source-indexed magic references
        run: |
          git config user.name "old-world-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/reference-records/magic-index.json docs/reference-records/magic-summary.json
          if git diff --cached --quiet; then
            echo "No magic index changes."
          else
            git commit -m "Refresh TOW magic lore and spell reference index"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
