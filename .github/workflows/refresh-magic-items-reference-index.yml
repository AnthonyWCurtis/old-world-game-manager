name: Refresh TOW magic items reference index
on:
  push:
    branches:
      - main
      - feat/magic-items-sitemap-index-20261109
    paths:
      - 'scripts/build-magic-items-reference-index.mjs'
      - '.github/workflows/refresh-magic-items-reference-index.yml'
  schedule:
    - cron: '54 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: magic-items-reference-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Index item categories and individual item or ability pages
        run: node --check scripts/build-magic-items-reference-index.mjs && node scripts/build-magic-items-reference-index.mjs
      - name: Commit source-linked magic items index and summary
        run: |
          git config user.name "old-world-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/reference-records/magic-items-index.json docs/reference-records/magic-items-summary.json
          if git diff --cached --quiet; then
            echo "No magic items index changes."
          else
            git commit -m "Refresh TOW magic items sitemap reference index"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
