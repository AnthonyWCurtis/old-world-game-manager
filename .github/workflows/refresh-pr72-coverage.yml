name: Refresh PR72 coverage after UI tests
on:
  push:
    branches:
      - fix/compact-roster-inline-full-view-20261113
    paths:
      - 'tests/**'
      - 'docs/unit-focus-view.js'
      - 'docs/unit-view-modes.js'
      - 'docs/unit-view-modes.css'
      - '.github/workflows/refresh-pr72-coverage.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild source-integrity coverage artifacts
        run: node scripts/build-rules-coverage.mjs
      - name: Commit deterministic generated artifacts if changed
        run: |
          git add docs/rules-coverage/register.json docs/rules-coverage/metrics.json docs/rules-coverage/report.md docs/rules-coverage/imported-selections.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh rule coverage integrity for inline unit views'
            git push
          fi
