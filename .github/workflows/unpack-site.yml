name: Publish browser edition
on:
  push:
    branches: [main]
    paths:
      - site.tar.gz.base64
      - .github/workflows/unpack-site.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the static website
        run: |
          base64 --decode site.tar.gz.base64 | tar -xz
          test -f docs/index.html
      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish browser importer to docs/"
            git push
          fi
