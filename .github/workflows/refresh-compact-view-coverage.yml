name: Refresh unit view coverage evidence (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/refresh-compact-view-coverage.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/compact-full-unit-views-20261113'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate hashed rule evidence from committed source files
        run: node scripts/build-rules-coverage.mjs
      - name: Commit regenerated evidence to this feature branch only
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules-coverage/
          if git diff --cached --quiet; then
            echo "Coverage evidence already up to date"
          else
            git commit -m "Refresh source-verified coverage hashes after unit view changes"
            git push origin "HEAD:$PR_BRANCH"
          fi
