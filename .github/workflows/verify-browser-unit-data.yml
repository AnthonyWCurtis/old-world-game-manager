name: Verify unit data in a mobile browser
on:
  push:
    branches:
      - feat/game-manager-v0-4-unit-data
    paths:
      - 'docs/app.js'
      - 'docs/index.html'
      - 'docs/unit-data.js'
      - 'docs/unit-detail-ui.js'
      - 'docs/unit-focus-view.js'
      - 'docs/unit-view-modes.js'
      - 'docs/unit-view-modes.css'
      - 'docs/unit-data/**'
      - 'docs/styles.css'
      - 'tests/unit-data-browser-smoke.mjs'
      - '.github/workflows/verify-browser-unit-data.yml'
  pull_request:
    paths:
      - 'docs/app.js'
      - 'docs/index.html'
      - 'docs/unit-data.js'
      - 'docs/unit-detail-ui.js'
      - 'docs/unit-focus-view.js'
      - 'docs/unit-view-modes.js'
      - 'docs/unit-view-modes.css'
      - 'docs/unit-data/**'
      - 'docs/styles.css'
      - 'tests/unit-data-browser-smoke.mjs'
      - '.github/workflows/verify-browser-unit-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser for runtime test
        run: |
          npm install --no-save playwright@1.56.1
          # Ubuntu hosted runners already include Chromium's shared runtime libs.
          # Download only the headless shell; apt font mirrors can be unavailable.
          npx playwright install --only-shell chromium
      - name: Serve the actual static website and test on a 390px viewport
        run: |
          python3 -m http.server 8787 --directory docs >/tmp/gm-http.log 2>&1 &
          sleep 2
          node tests/unit-data-browser-smoke.mjs
