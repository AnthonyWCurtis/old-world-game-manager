name: Verify rules coverage baseline
on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/rules-coverage-baseline.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/rules-coverage-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all importer and coverage tests
        run: node --test tests/*.test.mjs
      - name: Check reproducible committed coverage artifacts
        run: node scripts/build-rules-coverage.mjs --check
      - name: Check existing sitemap and source projector audits
        run: |
          node scripts/audit-rule-effect-coverage.mjs
          node scripts/audit-sitemap-coverage.mjs artifacts/sitemap-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage-1-rules-coverage
          path: |
            docs/rules-coverage/*.json
            docs/rules-coverage/*.md

  regenerate-ux-coverage-once:
    if: github.event_name == 'push' && github.ref_name == 'feat/compact-unit-ux-wounds-20261113'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate Stage 1 evidence artifacts on PR branch
        run: node scripts/build-rules-coverage.mjs
      - name: Commit only regenerated coverage files to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rules-coverage/register.json docs/rules-coverage/metrics.json docs/rules-coverage/report.md docs/rules-coverage/imported-selections.json
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate source-indexed rules coverage evidence for Units UX'
            git push origin HEAD:${{ github.ref_name }}
          fi
