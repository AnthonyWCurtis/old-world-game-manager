name: Verify army importer
on:
  push:
    paths:
      - 'docs/parser.js'
      - 'docs/reference-records/**'
      - 'docs/unit-data/**'
      - 'docs/unit-data.js'
      - 'docs/unit-detail-ui.js'
      - 'docs/unit-selection-matcher.js'
      - 'scripts/build-browser-unit-data.mjs'
      - 'docs/index.html'
      - 'docs/styles.css'
      - 'scripts/build-rules-reference-index.mjs'
      - 'scripts/build-magic-reference-index.mjs'
      - 'scripts/build-magic-items-reference-index.mjs'
      - 'scripts/build-armies-reference-index.mjs'
      - 'docs/catalog.js'
      - 'docs/live-source.js'
      - 'docs/app.js'
      - 'docs/report-*.js'
      - 'worker/**'
      - 'scripts/aggregate-unmatched.mjs'
      - 'docs/examples/**'
      - 'tests/**'
      - '.github/workflows/verify-importer.yml'
  pull_request:
    paths:
      - 'docs/parser.js'
      - 'docs/reference-records/**'
      - 'docs/unit-data/**'
      - 'docs/unit-data.js'
      - 'docs/unit-detail-ui.js'
      - 'docs/unit-selection-matcher.js'
      - 'scripts/build-browser-unit-data.mjs'
      - 'docs/index.html'
      - 'docs/styles.css'
      - 'scripts/build-rules-reference-index.mjs'
      - 'scripts/build-magic-reference-index.mjs'
      - 'scripts/build-magic-items-reference-index.mjs'
      - 'scripts/build-armies-reference-index.mjs'
      - 'docs/catalog.js'
      - 'docs/live-source.js'
      - 'docs/app.js'
      - 'docs/report-*.js'
      - 'worker/**'
      - 'scripts/aggregate-unmatched.mjs'
      - 'docs/examples/**'
      - 'tests/**'
      - '.github/workflows/verify-importer.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/build-rules-reference-index.mjs && node --check scripts/build-magic-reference-index.mjs && node --check scripts/build-magic-items-reference-index.mjs && node --check scripts/build-armies-reference-index.mjs && node --check scripts/build-browser-unit-data.mjs && node --check docs/unit-data.js && node --check docs/unit-detail-ui.js && node --check docs/app.js && node --check docs/live-source.js && node --check docs/report-submission.js && node --check docs/report-ui.js && node --check worker/unmatched-report-worker.mjs && node --check scripts/aggregate-unmatched.mjs && node --test tests/*.test.mjs
