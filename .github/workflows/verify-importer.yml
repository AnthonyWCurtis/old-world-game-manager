name: Verify army importer
on:
  push:
    paths:
      - 'docs/parser.js'
      - 'docs/catalog.js'
      - 'docs/live-source.js'
      - 'docs/app.js'
      - 'docs/examples/**'
      - 'tests/**'
      - '.github/workflows/verify-importer.yml'
  pull_request:
    paths:
      - 'docs/parser.js'
      - 'docs/catalog.js'
      - 'docs/live-source.js'
      - 'docs/app.js'
      - 'docs/examples/**'
      - 'tests/**'
      - '.github/workflows/verify-importer.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/app.js && node --check docs/live-source.js && node --test tests/*.test.mjs
