name: Build source-linked unit data for Game Manager
on:
  push:
    branches:
      - 'feat/**'
    paths:
      - 'scripts/build-browser-unit-data.mjs'
      - '.github/workflows/build-browser-unit-data.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: game-manager-unit-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download immutable source JSON from dedicated data-only branch commit
        run: |
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120             https://raw.githubusercontent.com/AnthonyWCurtis/old-world-game-manager/c9f888b0e4d0cca941c117829644ae9a33966942/old-world-all-armies-units.json             -o "$RUNNER_TEMP/old-world-all-armies-units.json"
          test -s "$RUNNER_TEMP/old-world-all-armies-units.json"
      - name: Build mobile data snapshots with strict coverage checks
        run: |
          node --check scripts/build-browser-unit-data.mjs
          node scripts/build-browser-unit-data.mjs             --input "$RUNNER_TEMP/old-world-all-armies-units.json"             --output docs/unit-data
          node - <<'JS'
          const fs=require('fs'),path=require('path');
          const index=JSON.parse(fs.readFileSync('docs/unit-data/index.json','utf8'));
          if(index.counts.units!==581||index.counts.armies!==19||index.shards!==32)throw Error('Incorrect unit index counts');
          for(const entry of index.entries){
           const shard=JSON.parse(fs.readFileSync(path.join('docs/unit-data/shards',entry.shard+'.json'),'utf8'));
           if(!shard.records[entry.id]||shard.records[entry.id].source.sourceUrl!==entry.sourceUrl)throw Error('Missing '+entry.id);
          }
          console.log('Verified '+index.entries.length+' source-linked unit records and all 32 shards');
          JS
      - name: Commit browser reference data only to a feature branch
        if: startsWith(github.ref_name, 'feat/')
        run: |
          git config user.name "source-unit-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/unit-data
          if git diff --cached --quiet; then
            echo "Unit data unchanged"
          else
            git commit -m "Publish 581 unit references in version-pinned browser shards"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
