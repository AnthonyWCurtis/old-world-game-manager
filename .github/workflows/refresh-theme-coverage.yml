name: Temporary regenerate Stage 2 theme coverage
on:
  push:
    branches:
      - fix/restore-navy-gold-unit-card-20261113
    paths:
      - .github/workflows/refresh-theme-coverage.yml
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-navy-gold-unit-card-20261113
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild deterministic source evidence without external access
        run: node scripts/build-rules-coverage.mjs
      - name: Commit regenerated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rules-coverage/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh theme-test source evidence"
            git push origin HEAD:fix/restore-navy-gold-unit-card-20261113
          fi
