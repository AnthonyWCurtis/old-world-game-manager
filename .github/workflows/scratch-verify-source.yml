name: Scratch source access and unit HTML structure check
on:
  push:
    branches: [scratch/independent-all-units-json-20261110]
    paths: ['.github/workflows/scratch-verify-source.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests beautifulsoup4 lxml
      - name: Check robots and real unit structure
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session()
          s.headers.update({'User-Agent':'IndependentOldWorldReferenceExporter/0.1 (private research)'})
          for url in ['https://tow.whfb.app/robots.txt','https://tow.whfb.app/sitemap/armies','https://tow.whfb.app/unit/lothern-sea-guard']:
              try:
                  r=s.get(url,timeout=25)
                  print('SOURCE',url,r.status_code,len(r.content),r.headers.get('Content-Type',''))
                  if url.endswith('robots.txt'):print('ROBOTS CONTENT',r.text[:2200].replace('\n',' / '))
                  if url.endswith('lothern-sea-guard') and r.ok:
                      soup=BeautifulSoup(r.text,'lxml')
                      print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
                      print('HTML FEATURES', [(k,len(soup.select(k))) for k in ['table.unit-profile-table','main','[class*="unit-profile__details"]','[class*="options"]','[class*="special-rule"]','[class*="equipment"]']])
                      for x in soup.select('[class*="unit-profile__details"]')[:20]:
                          print('DETAIL',x.get('class'),x.get_text(' ',strip=True)[:200])
                      opts=soup.select_one('.unit-profile__details--option')
                      print('OPTIONS HTML',str(opts)[:1400] if opts else 'MISSING')
                      import json
                      for script in soup.find_all('script'):
                          raw=script.string or script.get_text()
                          if not raw or '"pageProps"' not in raw[:2000]:continue
                          try: p=json.loads(raw)
                          except Exception:continue
                          if 'props' not in p:continue
                          props=p.get('props',{}).get('pageProps',{})
                          print('PAGE PROPS KEYS',list(props))
                          entry=props.get('entry',{})
                          print('ENTRY KEYS',[(k,type(v).__name__,(len(v) if isinstance(v,(list,dict)) else '') ) for k,v in entry.items()])
                          fields=entry.get('fields',{})
                          for k,v in fields.items():
                              if isinstance(v,list):print('FIELD STRUCT',k,'list',len(v),[str(x)[:450] for x in v[:2]])
                              elif isinstance(v,dict):
                                  print('FIELD STRUCT',k,'dict keys',list(v)[:16])
                                  print('FIELD PREVIEW',k,json.dumps(v,ensure_ascii=False)[:1200])
                              else:print('FIELD STRUCT',k,repr(v)[:250])
                          print('SYS ENTRY',json.dumps(entry.get('sys',{}),ensure_ascii=False)[:1800])
                          print('CROSS REF TYPE',type(props.get('crossReference')).__name__)

                          for k,v in entry.items():
                              if isinstance(v,dict):print('ENTRY SUBKEYS',k,[(a,type(b).__name__) for a,b in list(v.items())[:25]])
                              elif isinstance(v,list): print('ENTRY LIST HEAD',k,[str(z)[:180] for z in v[:2]])
                              else:print('ENTRY FIELD',k,repr(v)[:120])
                          break
                      for tag in soup.find_all(string=True):
                          if 'Last update' in tag or 'Forces of Fantasy' in tag:
                              print('META NODE',tag.parent.name,tag.parent.get('class'),str(tag)[:160])
              except Exception as e:print('ERROR',url,str(e)[:250])
          PY
