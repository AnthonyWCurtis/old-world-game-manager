name: Refresh TOW rules reference index
on:
  push:
    branches:
      - main
      - feat/rules-sitemap-index-20261109
    paths:
      - 'scripts/build-rules-reference-index.mjs'
      - '.github/workflows/refresh-rules-reference-index.yml'
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rules-reference-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Index titles and URLs from public rules sitemap
        run: node --check scripts/build-rules-reference-index.mjs && node scripts/build-rules-reference-index.mjs
      - name: Commit changes to reference index
        run: |
          git config user.name "old-world-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/reference-records/rules-index.json docs/reference-records/rules-summary.json
          if git diff --cached --quiet; then
            echo "No rules index changes."
          else
            git commit -m "Refresh TOW rules sitemap reference index"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
