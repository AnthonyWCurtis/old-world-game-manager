name: Refresh public TOW unit model and wizard source fallback
on:
  push:
    paths:
      - 'scripts/refresh-source-profiles.mjs'
      - 'scripts/extract-wizard-magic.mjs'
      - 'scripts/extract-published-armour.mjs'
      - '.github/workflows/refresh-source-profiles.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tow-profile-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh bounded public unit model and wizard data
        run: node --check scripts/refresh-source-profiles.mjs && node scripts/refresh-source-profiles.mjs
      - name: Commit refreshed same-origin source snapshot
        run: |
          git config user.name "old-world-source-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/source-profiles.json
          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "Refresh cached TOW unit model references with provenance"
            git pull --rebase origin main
            git push
          fi
