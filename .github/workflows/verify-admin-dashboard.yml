name: Verify authenticated report admin dashboard
on:
  push:
    branches:
      - feat/admin-report-review-dashboard
    paths:
      - 'worker/**'
      - 'tests/admin-*.mjs'
      - '.github/workflows/verify-admin-dashboard.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'tests/admin-*.mjs'
      - '.github/workflows/verify-admin-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test auth, report parsing and server authorization
        run: node --test tests/admin-auth.test.mjs tests/admin-reports.test.mjs tests/admin-worker.test.mjs tests/admin-page.test.mjs
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test admin dashboard at 390px
        run: node tests/admin-browser-smoke.mjs
